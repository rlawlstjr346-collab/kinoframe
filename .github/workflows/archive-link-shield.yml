name: KINOFRAME Archive Link Shield & Quality Check

on:
  schedule:
    # 매주 월요일 새벽 04:00 KST (일요일 19:00 UTC)
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-archive-and-build:
    name: Link Shield, Contract Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Respectful Archive Link Shield (ETag + Jitter + Circuit Breaker)
        run: npm run verify:links

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run Vitest archive contract tests
        run: npx vitest run

      - name: Verify Next.js production build
        run: npm run build
